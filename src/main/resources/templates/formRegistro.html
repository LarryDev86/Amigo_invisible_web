<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <!-- Con esto hacemos que se ajuste mejor en los moviles -->
      <meta name="viewport" content="width=device-width, initial-scale=1">

      <!--Linkeado para aspecto de whatsapp-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
      <!--Linkeado para aspecto de whatsapp-->
      <title>Alta familiar</title>
      <!-- Bootstrap core CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
      <link th:href="@{/estilo.css}" rel="stylesheet">
  </head>

  <body>

    <header>
        <header class="bg-primary text-white py-4 mb-4">
            <div class="container text-center">
                <h1 class="fw-bold">🎁 Amigo Invisible</h1>
            </div>
            <div class="d-flex justify-content-end">
                <!-- Botón logout-->
                <a class="btn btn-primary" th:href="@{/logout}">Volver al menú</a>
            </div>
        </header>
    </header>
    <main role="main">     
      <hr>
      <div class="container">
        <div class="card">
          <h4 class="card-header"><strong>Nuevo Familiar</strong></h4>
          <div class="card-body">
            <form th:action="@{/create}" method="GET" class="form-signin" >
              <div class="row">
                <div class="col-md-3"> 
                  <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escriba su nombre" required="required">
                  </div>
                </div>
              </div>                  
              <hr>
              <button type="submit" title="Quiero registrarme." class="btn btn-primary">Registrar</button>
            </form>
          </div>
        </div>
      </div> <!-- /container -->

    </main>
    <!-- copyryde -->
    <footer class="pie">

        <small>
            © 2025 Alfonso Redondo. Todos los derechos reservados.
        </small>

    </footer>
  </body>
</html>


<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Con esto hacemos que se ajuste mejor en los moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Amigo invisible - Formulario Login</title>
    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link th:href="@{/estilo.css}" rel="stylesheet">

</head>

<body>
<header class="cabecera">

    <div class="titulo-header">
        <h1>🎁 Amigo Invisible</h1>
    </div>

    <a class="login-admin" th:href="@{/logout}">
        Volver al menú
    </a>

</header>
<main>
    <form th:action="@{/login}" method="post" class="px-4 py-3">
        <div class="row">
            <div class="col-md-4">
            </div>
            <div class="col-md-4">
                <img class="mb-4 rounded mx-auto d-block" th:src="@{/lock.png}" alt="" width="128" height="128">
                <h4 class="h3 mb-3 font-weight-normal">Login</h4>
                <div th:if="${param.error}" id="mensajeLogin">
                    <span class="mensaje-flotante alert alert-danger" role="alert">Credenciales incorrectos!</span>
                </div>
                <label for="username" class="sr-only">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Username" required autofocus><br>
                <label for="password" class="sr-only">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Password" required><br>
                <button class="btn-enviar" type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>Entrar
                </button>
                <p class="text-primary" style="font-size: small">¿Todavía no estas registrado? <a href="#">Regístrate</a></p>
            </div>
            <div class="col-md-4">
            </div>
        </div>
    </form>
</main>
<!-- copyryde -->
<footer class="pie">

    <small>
        © 2026 Alfonso Redondo. Todos los derechos reservados.
    </small>

</footer>
<script th:src="@{/js/animacion.js}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
</body>
</html>
